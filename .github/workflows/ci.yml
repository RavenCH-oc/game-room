# 每個 PR、以及推到 main 時，自動跑安裝、測試、型別檢查、打包。
# Node 版本照 package.json 的 engines（>=22.18）：測最低支援的 22.18，以及開發用的 24。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.18.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
